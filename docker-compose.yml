name: sw25-rule-bot

x-python-service: &python-service
  build:
    context: .
    dockerfile: docker/app/Dockerfile

  restart: unless-stopped

  environment:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OCR_DIR: /data/ocr
    INDEX_DIR: /data/vector_index
    BOOK_CATEGORY_PATH: /data/book/book_categories.json
    PDF_DIR: /data/pdf
    PDFJS_BASE_URL: ${PDFJS_BASE_URL}
    IMAGE_BASE_URL: ${IMAGE_BASE_URL}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}

  volumes:
    - ${HOST_OCR_DIR}:/data/ocr:ro
    - ${HOST_VECTOR_INDEX_DIR}:/data/vector_index:ro
    - ${HOST_METADATA_DIR}:/data/book:ro
    - ${HOST_PDF_DIR}:/data/pdf:ro


services:

  api:
    <<: *python-service

    command:
      - uvicorn
      - qa_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  ui:
    <<: *python-service

    command:
      - streamlit
      - run
      - app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OCR_DIR: /data/ocr
      INDEX_DIR: /data/vector_index
      BOOK_CATEGORY_PATH: /data/book/book_categories.json
      PDF_DIR: /data/pdf

      # Docker内部通信
      QA_API_URL: http://api:8000/ask

      # ブラウザに返す公開URL
      PDFJS_BASE_URL: ${PDFJS_BASE_URL}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL}

    depends_on:
      - api
      - pdfjs

    ports:
      - "${HOST_UI_PORT:-8501}:8501"


  discord:
    <<: *python-service

    command:
      - python
      - bot.py

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DISCORD_TOKEN: ${DISCORD_TOKEN}

      OCR_DIR: /data/ocr
      INDEX_DIR: /data/vector_index
      BOOK_CATEGORY_PATH: /data/book/book_categories.json
      PDF_DIR: /data/pdf

      # Docker内部通信
      QA_API_URL: http://api:8000/ask

      # Discordへ返す公開URL
      PDFJS_BASE_URL: ${PDFJS_BASE_URL}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL}

    depends_on:
      - api
      - pdfjs


  pdfjs:
    build:
      context: .
      dockerfile: docker/pdfjs/Dockerfile
      args:
        PDFJS_VERSION: ${PDFJS_VERSION:-5.7.284}

    restart: unless-stopped

    volumes:
      - ${HOST_PDF_WEB_DIR}:/srv/sw25/pdf:ro
      - ${HOST_IMAGE_DIR}:/srv/sw25/image:ro

    ports:
      - "${HOST_PDFJS_PORT:-8080}:80"


  index-builder:
    build:
      context: .
      dockerfile: docker/app/Dockerfile

    profiles:
      - tools

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OCR_DIR: /data/ocr
      INDEX_DIR: /data/vector_index
      BOOK_CATEGORY_PATH: /data/book/book_categories.json
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}

    volumes:
      - ${HOST_OCR_DIR}:/data/ocr:ro
      - ${HOST_VECTOR_INDEX_DIR}:/data/vector_index
      - ${HOST_METADATA_DIR}:/data/book:ro

    command:
      - python
      - build_faiss_index.py

  pdf-optimizer:
    build:
      context: .
      dockerfile: docker/pdf-optimizer/Dockerfile

    profiles:
      - tools

    volumes:
      # 原本は絶対に書き込ませない
      - ${HOST_PDF_DIR}:/data/pdf-original:ro

      # PDF.js専用軽量PDF
      - ${HOST_PDF_WEB_DIR}:/data/pdf-web

    environment:
      PDF_OPTIMIZER_WIDTH: "1400"
      PDF_OPTIMIZER_JPEG_QUALITY: "68"

    command:
      - python
      - /app/scripts/optimize_pdfs.py

  ocr-builder:
    build:
      context: .
      dockerfile: docker/ocr-builder/Dockerfile

    profiles:
      - tools

    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-vision.json

      OCR_IMAGE_DIR: /data/image
      OCR_OUTPUT_DIR: /data/ocr
      OCR_WORK_DIR: /data/ocr-work

      GOOGLE_VISION_LANGUAGE_HINTS: "ja"

      OCR_MAX_RETRIES: "5"
      OCR_RETRY_BASE_SECONDS: "2"
      OCR_REQUEST_INTERVAL_SECONDS: "0.1"
      OCR_REQUEST_TIMEOUT_SECONDS: "180"

    volumes:
      # 元JPEGは絶対に変更しない
      - ${HOST_IMAGE_DIR}:/data/image:ro

      # 完成したOCR JSON
      - ${HOST_OCR_DIR}:/data/ocr

      # ページ単位の途中結果
      - ${HOST_OCR_WORK_DIR}:/data/ocr-work

      # Google Cloud認証情報
      # Gitリポジトリには保存しない
      - ${HOST_GOOGLE_CREDENTIALS}:/run/secrets/google-vision.json:ro

    command:
      - python
      - /app/scripts/google_vision_ocr.py

  page-map-builder:
    build:
      context: .
      dockerfile: docker/app/Dockerfile

    profiles:
      - tools

    environment:
      OCR_DIR: /data/ocr

      PAGE_MAP_DIR: /data/metadata/page_maps
      PAGE_OVERRIDE_DIR: /data/metadata/page_overrides

      PAGE_MAP_TAIL_LINES: "10"
      PAGE_MAP_MAX_LOGICAL_PAGE: "1000"

      PAGE_MAP_MIN_MATCH_COUNT: "10"

      PAGE_MAP_HIGH_CONFIDENCE_RATIO: "0.70"
      PAGE_MAP_MEDIUM_CONFIDENCE_RATIO: "0.40"

      PAGE_MAP_MIN_WINNER_MARGIN: "3.0"

    volumes:
      # OCRは読み取り専用
      - ${HOST_OCR_DIR}:/data/ocr:ro

      # 自動生成page map
      - ${HOST_METADATA_DIR}/page_maps:/data/metadata/page_maps

      # 自動判定できない書籍だけ手動指定
      - ${HOST_METADATA_DIR}/page_overrides:/data/metadata/page_overrides:ro

    command:
      - python
      - /app/scripts/build_page_map.py