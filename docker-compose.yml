name: sw25-rule-bot

x-python-service: &python-service
  build:
    context: .
    dockerfile: docker/app/Dockerfile

  restart: unless-stopped

  environment:
    OPENAI_API_KEY: ${OPENAI_API_KEY}

    TEAM_DOMAIN: ${TEAM_DOMAIN}
    POLICY_AUD: ${POLICY_AUD}

    USER_DB_PATH: ${USER_DB_PATH:-/data/app/sw25.sqlite3}
    INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
    INITIAL_ADMIN_DISPLAY_NAME: ${INITIAL_ADMIN_DISPLAY_NAME:-}

    OCR_DIR: /data/ocr
    INDEX_DIR: /data/vector_index

    METADATA_DIR: /data/metadata
    BOOK_CATEGORY_PATH: /data/metadata/book_categories.json

    NAVIGATION_DIR: /data/metadata/navigation
    NAVIGATION_REQUIRED: "1"

    # 通常Hybridの候補母集団
    HYBRID_CANDIDATE_K: "100"

    # navigation
    NAV_INDEX_MAX_PAGES: "8"
    NAV_TOC_MAX_PAGES: "4"

    NAV_SECTION_EXPAND_PAGES: "2"
    NAV_SECTION_MAX_PAGES: "6"

    # navigation由来ページはkとは別枠で保持するが、無制限にはしない
    NAV_MANDATORY_MAX_PAGES: "12"

    # navigation 1ページから最大2chunk
    NAV_CHUNKS_PER_PAGE: "2"

    # reranking / pruning後のLLMコンテキスト安全上限
    CONTEXT_MAX_DOCS: "24"

    # 出典一覧に表示する本文抜粋の最大文字数
    CITATION_EXCERPT_CHARS: "360"

    NAV_INDEX_FUZZY_THRESHOLD: "0.72"
    NAV_TOC_FUZZY_THRESHOLD: "0.60"

    SOURCE_AUTHORITY_STRENGTH: "0.20"
    SOURCE_AUTHORITY_MAX: "1.35"

    PDF_DIR: /data/pdf
    PDFJS_BASE_URL: ${PDFJS_BASE_URL}
    IMAGE_BASE_URL: ${IMAGE_BASE_URL}

    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}

  volumes:
    - ${HOST_OCR_DIR}:/data/ocr:ro
    - ${HOST_VECTOR_INDEX_DIR}:/data/vector_index:ro
    - ${HOST_METADATA_DIR}:/data/metadata:ro
    - ${HOST_PDF_DIR}:/data/pdf:ro
    - ${HOST_APP_DATA_DIR}:/data/app


services:

  api:
    <<: *python-service

    # SQLiteをホスト側でroot所有にしない。
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    command:
      - uvicorn
      - qa_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  ui:
    <<: *python-service

    command:
      - streamlit
      - run
      - app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OCR_DIR: /data/ocr
      INDEX_DIR: /data/vector_index
      BOOK_CATEGORY_PATH: /data/metadata/book_categories.json
      PDF_DIR: /data/pdf

      # Docker内部通信
      QA_API_URL: http://api:8000/ask

      # ブラウザに返す公開URL
      PDFJS_BASE_URL: ${PDFJS_BASE_URL}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL}

    depends_on:
      - api
      - pdfjs

    ports:
      - "${HOST_UI_PORT:-8501}:8501"


  discord:
    <<: *python-service

    command:
      - python
      - bot.py

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DISCORD_TOKEN: ${DISCORD_TOKEN}

      OCR_DIR: /data/ocr
      INDEX_DIR: /data/vector_index
      BOOK_CATEGORY_PATH: /data/metadata/book_categories.json
      PDF_DIR: /data/pdf

      # Docker内部通信
      QA_API_URL: http://api:8000/ask

      # Discordへ返す公開URL
      PDFJS_BASE_URL: ${PDFJS_BASE_URL}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL}

    depends_on:
      - api
      - pdfjs


  pdfjs:
    build:
      context: .
      dockerfile: docker/pdfjs/Dockerfile
      args:
        PDFJS_VERSION: ${PDFJS_VERSION:-5.7.284}
        PDFJS_DEFAULT_ZOOM: ${PDFJS_DEFAULT_ZOOM:-page-fit}
        PDFJS_DEFAULT_SCROLL_MODE: ${PDFJS_DEFAULT_SCROLL_MODE:-0}
        PDFJS_DEFAULT_SPREAD_MODE: ${PDFJS_DEFAULT_SPREAD_MODE:-2}

    restart: unless-stopped

    volumes:
      - ${HOST_PDF_WEB_DIR}:/srv/sw25/pdf:ro
      - ${HOST_IMAGE_DIR}:/srv/sw25/image:ro

    ports:
      - "${HOST_PDFJS_PORT:-8080}:80"


  index-builder:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    build:
      context: .
      dockerfile: docker/app/Dockerfile

    profiles:
      - tools

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OCR_DIR: /data/ocr
      INDEX_DIR: /data/vector_index

      METADATA_DIR: /data/metadata
      BOOK_CATEGORY_PATH: /data/metadata/book_categories.json

      PAGE_MAP_DIR: /data/metadata/page_maps

      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}

    volumes:
      - ${HOST_OCR_DIR}:/data/ocr:ro
      - ${HOST_VECTOR_INDEX_DIR}:/data/vector_index
      - ${HOST_METADATA_DIR}:/data/metadata:ro

    command:
      - python
      - build_faiss_index.py

  pdf-optimizer:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    build:
      context: .
      dockerfile: docker/pdf-optimizer/Dockerfile

    profiles:
      - tools

    volumes:
      # 原本は絶対に書き込ませない
      - ${HOST_PDF_DIR}:/data/pdf-original:ro

      # PDF.js専用軽量PDF
      - ${HOST_PDF_WEB_DIR}:/data/pdf-web

    environment:
      PDF_OPTIMIZER_WIDTH: "1400"
      PDF_OPTIMIZER_JPEG_QUALITY: "68"

    command:
      - python
      - /app/scripts/optimize_pdfs.py

  ocr-builder:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    build:
      context: .
      dockerfile: docker/ocr-builder/Dockerfile

    profiles:
      - tools

    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-vision.json

      OCR_IMAGE_DIR: /data/image
      OCR_OUTPUT_DIR: /data/ocr
      OCR_WORK_DIR: /data/ocr-work

      GOOGLE_VISION_LANGUAGE_HINTS: "ja"

      OCR_MAX_RETRIES: "5"
      OCR_RETRY_BASE_SECONDS: "2"
      OCR_REQUEST_INTERVAL_SECONDS: "0.1"
      OCR_REQUEST_TIMEOUT_SECONDS: "180"

    volumes:
      # 元JPEGは絶対に変更しない
      - ${HOST_IMAGE_DIR}:/data/image:ro

      # 完成したOCR JSON
      - ${HOST_OCR_DIR}:/data/ocr

      # ページ単位の途中結果
      - ${HOST_OCR_WORK_DIR}:/data/ocr-work

      # Google Cloud認証情報
      # Gitリポジトリには保存しない
      - ${HOST_GOOGLE_CREDENTIALS}:/run/secrets/google-vision.json:ro

    command:
      - python
      - /app/scripts/google_vision_ocr.py

  page-map-builder:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    build:
      context: .
      dockerfile: docker/app/Dockerfile

    profiles:
      - tools

    environment:
      OCR_DIR: /data/ocr

      PAGE_MAP_DIR: /data/metadata/page_maps
      PAGE_OVERRIDE_DIR: /data/metadata/page_overrides

      PAGE_MAP_TAIL_LINES: "10"
      PAGE_MAP_MAX_LOGICAL_PAGE: "1000"
      PAGE_MAP_MIN_MATCH_COUNT: "10"
      PAGE_MAP_HIGH_CONFIDENCE_RATIO: "0.70"
      PAGE_MAP_MEDIUM_CONFIDENCE_RATIO: "0.40"
      PAGE_MAP_MIN_WINNER_MARGIN: "3.0"

    volumes:
      - ${HOST_OCR_DIR}:/data/ocr:ro

      # page-map-builderだけmetadataへ書き込み可能
      - ${HOST_METADATA_DIR}:/data/metadata

    command:
      - python
      - /app/scripts/build_page_map.py

  book-navigation-builder:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    build:
      context: .
      dockerfile: docker/app/Dockerfile

    profiles:
      - tools

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      OCR_DIR: /data/ocr
      IMAGE_DIR: /data/image

      PAGE_MAP_DIR: /data/metadata/page_maps

      NAVIGATION_DIR: /data/metadata/navigation
      NAVIGATION_WORK_DIR: /data/metadata/navigation_work

      NAVIGATION_MODEL: ${NAVIGATION_MODEL:-gpt-4.1-mini}

      # API耐障害性
      NAVIGATION_REQUEST_TIMEOUT: "120"
      NAVIGATION_MAX_RETRIES: "2"

      # 通常ページで出力が巨大になったら、
      # この制限に達した時点でtile fallbackへ移行
      NAVIGATION_MAX_OUTPUT_TOKENS: "12000"

      # 画像
      NAVIGATION_IMAGE_MAX_SIDE: "2400"
      NAVIGATION_JPEG_QUALITY: "88"

      # length-limit fallback
      NAVIGATION_TILE_ROWS: "2"
      NAVIGATION_TILE_COLS: "2"
      NAVIGATION_TILE_OVERLAP: "0.10"

      # 目次
      TOC_SCAN_END_RATIO: "0.30"
      TOC_MAX_PAGES: "10"

      # 索引
      INDEX_SCAN_START_RATIO: "0.60"
      INDEX_MAX_PAGES: "12"
      MAX_INDEX_HEADING_LENGTH: "30"

      # 1にすると完成済み・checkpointも無視して再生成
      NAVIGATION_FORCE_REBUILD: "0"

    volumes:
      - ${HOST_OCR_DIR}:/data/ocr:ro
      - ${HOST_IMAGE_DIR}:/data/image:ro

      - ${HOST_METADATA_DIR}/page_maps:/data/metadata/page_maps:ro

      # 完成データ
      - ${HOST_METADATA_DIR}/navigation:/data/metadata/navigation

      # ページ・タイル単位checkpoint
      - ${HOST_METADATA_DIR}/navigation_work:/data/metadata/navigation_work

    command:
      - python
      - /app/scripts/build_book_navigation.py

  official-source-builder:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    build:
      context: .
      dockerfile: docker/app/Dockerfile

    profiles:
      - tools

    volumes:
      # GroupSNE等から取得したrawデータと抽出結果
      - ${HOST_OFFICIAL_DIR}:/data/official

      # official_sources.json は本番サーバ側metadataにのみ存在
      - ${HOST_METADATA_DIR}:/data/metadata:ro

    command:
      - python
      - fetch_official_sources.py
      - --config
      - /data/metadata/official_sources.json
      - --output-dir
      - /data/official/raw
