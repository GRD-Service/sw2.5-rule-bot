name: sw25-rule-bot

x-python-service: &python-service
  build:
    context: .
    dockerfile: docker/app/Dockerfile

  restart: unless-stopped

  environment:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OCR_DIR: /data/ocr
    INDEX_DIR: /data/vector_index
    BOOK_CATEGORY_PATH: /data/book/book_categories.json
    PDF_DIR: /data/pdf
    PDFJS_BASE_URL: ${PDFJS_BASE_URL}
    IMAGE_BASE_URL: ${IMAGE_BASE_URL}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}

  volumes:
    - ${HOST_OCR_DIR}:/data/ocr:ro
    - ${HOST_VECTOR_INDEX_DIR}:/data/vector_index:ro
    - ${HOST_BOOK_DIR}:/data/book:ro
    - ${HOST_PDF_DIR}:/data/pdf:ro


services:

  api:
    <<: *python-service

    command:
      - uvicorn
      - qa_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  ui:
    <<: *python-service

    command:
      - streamlit
      - run
      - app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OCR_DIR: /data/ocr
      INDEX_DIR: /data/vector_index
      BOOK_CATEGORY_PATH: /data/book/book_categories.json
      PDF_DIR: /data/pdf

      # Docker内部通信
      QA_API_URL: http://api:8000/ask

      # ブラウザに返す公開URL
      PDFJS_BASE_URL: ${PDFJS_BASE_URL}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL}

    depends_on:
      - api
      - pdfjs

    ports:
      - "${HOST_UI_PORT:-8501}:8501"


  discord:
    <<: *python-service

    command:
      - python
      - bot.py

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DISCORD_TOKEN: ${DISCORD_TOKEN}

      OCR_DIR: /data/ocr
      INDEX_DIR: /data/vector_index
      BOOK_CATEGORY_PATH: /data/book/book_categories.json
      PDF_DIR: /data/pdf

      # Docker内部通信
      QA_API_URL: http://api:8000/ask

      # Discordへ返す公開URL
      PDFJS_BASE_URL: ${PDFJS_BASE_URL}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL}

    depends_on:
      - api
      - pdfjs


  pdfjs:
    build:
      context: .
      dockerfile: docker/pdfjs/Dockerfile
      args:
        PDFJS_VERSION: ${PDFJS_VERSION:-5.7.284}

    restart: unless-stopped

    volumes:
      - ${HOST_PDF_WEB_DIR}:/srv/sw25/pdf:ro
      - ${HOST_IMAGE_DIR}:/srv/sw25/image:ro

    ports:
      - "${HOST_PDFJS_PORT:-8080}:80"


  index-builder:
    build:
      context: .
      dockerfile: docker/app/Dockerfile

    profiles:
      - tools

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OCR_DIR: /data/ocr
      INDEX_DIR: /data/vector_index
      BOOK_CATEGORY_PATH: /data/book/book_categories.json
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}

    volumes:
      - ${HOST_OCR_DIR}:/data/ocr:ro
      - ${HOST_VECTOR_INDEX_DIR}:/data/vector_index
      - ${HOST_BOOK_DIR}:/data/book:ro

    command:
      - python
      - build_faiss_index.py

  pdf-optimizer:
    build:
      context: .
      dockerfile: docker/pdf-optimizer/Dockerfile

    profiles:
      - tools

    volumes:
      # 原本は絶対に書き込ませない
      - ${HOST_PDF_DIR}:/data/pdf-original:ro

      # PDF.js専用軽量PDF
      - ${HOST_PDF_WEB_DIR}:/data/pdf-web

    environment:
      PDF_OPTIMIZER_WIDTH: "1400"
      PDF_OPTIMIZER_JPEG_QUALITY: "68"

    command:
      - python
      - /app/scripts/optimize_pdfs.py